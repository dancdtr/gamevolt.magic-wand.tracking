  source: Harry Potter and the Chamber of Secrets (film)
colloportus:
  nickname: The Locking Charm
  description: Locks and seals objects
  classification: Charm
  difficulty: Intermediate
  pronunciation: koh-low-POR-tus
  notable_uses: Harry, Hermione, Neville and Luna seal the doors behind them as they're being chased through the Department of Mysteries
