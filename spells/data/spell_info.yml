  description: Inflicts intense, excruciating pain on the target - one of the three Unforgivable Curses
  classification: Curse
  difficulty: Advanced
  pronunciation: KROO-see-oh
  notable_uses: Voldemort attacks Harry with the Cruciatus Curse twice during their battle in the Little Hangleton graveyard
