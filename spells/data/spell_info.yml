cauldrons_to_cabbages_spell:
  description: Transfigures a cauldron into a cabbage
  classification: Spell
  difficulty: Beginner
  notable_uses: N/A (Used in Games)
  source: "Harry Potter: Hogwarts Mystery (video game)"
cave_inimicum:
