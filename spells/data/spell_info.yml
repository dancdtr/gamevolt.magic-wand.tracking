# Static spell lore — reference copy shown in the visualiser, decoupled from
# scoring/appsettings. Keyed by SpellType value (lower-case enum name; the same
# key the gesture templates use: spell_template_<key>.svg).
#
# All fields optional: missing spells / missing fields degrade gracefully in the
# UI (they are UX-only, never affect a cast). See spells/spell_info.py.
#
# display_name defaults to the title-cased key when omitted; set it only to
# override (e.g. multi-word or unusual capitalisation).
#
# Auto-extracted from SpellsPrimer_05.01.22.pdf, both sections (with/without known
# incantations), keyed to the gesture-template filenames (scratchpad/extract_v2.py).

aberto:
  nickname: The Opening Charm
  description: Opens objects
  classification: Charm
  difficulty: Intermediate
  pronunciation: ah-BARE-toh
  notable_uses: Queenie Goldstein tries to open Percival Graves's office after Alohomora fails
  source: Fantastic Beasts and Where to Find Them (screenplay)
accio:
  nickname: The Summoning Charm
  description: Summons desired objects (either in or out of eyesight) to the spellcaster
  classification: Charm
  difficulty: Intermediate
  pronunciation: AH-key-oh
  notable_uses: Harry summons his Firebolt from the castle during the First Task of the Triwizard Tournament
  source: Harry Potter and the Goblet of Fire (book)
age_line_spell:
  description: Creates a thin, golden line that determines access to a certain object or place by age
  classification: Spell
  difficulty: Advanced
  notable_uses: Dumbledore places an Age Line around the Goblet of Fire to prevent students under seventeen from attempting to enter the Triwizard Tournament
  source: Fantastic Beasts and Where to Find Them / Harry Potter and the Goblet of Fire (book)
aguamenti:
  nickname: The Water-Conjuring Charm
  description: Conjures clean, drinkable water from the end of the wand
  classification: Charm
  difficulty: Intermediate
  pronunciation: AH-gwah-MEN-tee
  notable_uses: Hermione extinguishes Mundungus Fletcher's eyebrows after Harry accidentally ignites them with red sparks
  source: Harry Potter and the Deathly Hallows (book)
alarte_ascendare:
  nickname: The Vaulting Charm
  description: Rapidly throws the target high into the air
  classification: Charm
  difficulty: Intermediate
  pronunciation: ah-LAAR-tay ah-SEN-dar-ay
  notable_uses: During the Duelling Club, Gilderoy Lockhart throws a snake high into the air
  source: Harry Potter and the Chamber of Secrets (film)
alohomora:
  nickname: The Unlocking Charm
  description: Unlocks objects
  classification: Charm
  difficulty: Beginner
  pronunciation: ah-LOH-ho-MOR-ah
  notable_uses: Hermione unlocks the door to the forbidden 3rd floor corridor to hide from Argus Filch
  source: Harry Potter and the Philosopher's Stone (book)
anapneo:
  nickname: The Dislodging Charm
  description: A healing charm that clears the target's airway
  classification: Charm
  difficulty: Intermediate
  pronunciation: ah-NAP-nee-oh
  notable_uses: Professor Slughorn assists a choking Marcus Belby
  source: Harry Potter and the Half-Blood Prince (book)
anteoculatia:
  nickname: The Antler Hex
  description: Sprouts antlers from the top of the target's head
  classification: Hex
  difficulty: Intermediate
  pronunciation: an-tee-oh-kyoo-LAY-shee-ah
  notable_uses: Pansy Parkinson was hit with this hex due to her involvement in the Inquisitorial Squad
  source: Harry Potter and the Order of the Phoenix (book)
anti_alohomora_charm:
  description: Magically protects a lock from being opened by Alohomora
  classification: Charm
  difficulty: Intermediate
  notable_uses: N/A (Used in Games)
  source: "Harry Potter: Hogwarts Mystery (video game)"
anti_apparation_jinx:
  description: An enchantment that prevents Apparation/Disapparation within a designated area
  classification: Jinx
  difficulty: Advanced
  notable_uses: Dumbledore contains several escaped Death Eaters in the Death Chamber following the battle at the Ministry of Magic
  source: Harry Potter and the Order of the Phoenix (book)
anti_cheating_charm:
  description: Prevents cheating on bewitched objects
  classification: Charm
  difficulty: Advanced
  notable_uses: Hogwarts First Years were given special, bewitched quills during their final exams
  source: Harry Potter and the Philosophers Stone (book)
aparecium:
  nickname: The Revealing Charm
  description: Reveals invisible ink and messages hidden by magical means
  classification: Charm
  difficulty: Intermediate
  pronunciation: AH-par-EH-see-um
  notable_uses: Hermione unsuccessfully tries to reveal the contents of Tom Riddle's diary
  source: Harry Potter and the Chamber of Secrets (book)
appare_vestigium:
  nickname: The Tracking Spell
  description: Illuminates recent tracks of magical activity in the area
  classification: Spell
  difficulty: Advanced
  pronunciation: ah-PAR-ay ves-TEE-jee-um
  notable_uses: Newt Scamander uses this to investigate what happened to Tina in Place Cachée
  source: "Fantastic Beasts: The Crimes of Grindelwald (screenplay)"
arania_exumai:
  nickname: The Spider-Banishing Charm
  description: A non-explosive spell used for blasting spiders away
  classification: Charm
  difficulty: Beginner
  pronunciation: ah-RAHN-ee-ah EX-oo-may
  notable_uses: Used by Harry to blast Acromantulas out of the way
  source: Harry Potter and the Chamber of Secrets (film)
arresto_momentum:
  nickname: The Braking Charm
  description: Stops or slows-down the target
  classification: Charm
  difficulty: Intermediate
  pronunciation: ah-REST-oh moh-MEN-tum
  notable_uses: Used by Dumbeldore to save a falling Quidditch player
  source: Harry Potter and the Prisoner of Azkaban (film)
arrow_shooting_spell:
  description: Shoots arrows from the tip of the wand
  classification: Spell
  difficulty: Intermediate
  notable_uses: Fans of the Appleby Arrows would celebrate with this spell, until one pierced a referee through the nose
  source: Quiditch Through The Ages (book)
ascendio:
  nickname: The Ascension Charm
  description: Lifts the target high into the air
  classification: Charm
  difficulty: Intermediate
  pronunciation: ah-SEN-dee-oh
  notable_uses: Used by Harry in the Triwizard Tournament after being attacked by grindylows
  source: Harry Potter and the Goblet of Fire (film)
avada_kedavra:
  nickname: The Killing Curse
  description: Causes the instantaneous, painless death of the target - one of the three Unforgivable Curses
  classification: Curse
  difficulty: Advanced
  pronunciation: ah-VAH-DA ke-DAH-vra
  notable_uses: Wormtail kills Cedric Diggory
  source: Harry Potter and the Goblet of Fire (book)
avenseguim:
  nickname: The Tracking Charm
  description: Enchants objects to point and return to their last owner
  classification: Charm
  difficulty: Intermediate
  pronunciation: ah-ven-SEH-gwim
  notable_uses: Newt charms a feather to lead to Yusuf Kama
  source: "Fantastic Beasts: The Crimes of Grindelwald (screenplay)"
avifors:
  nickname: The Objects-To-Birds Spell
  description: Transfigures small objects into birds
  classification: Spell
  difficulty: Beginner
  pronunciation: AH-vi-fors
  notable_uses: N/A (Created by JKR for Games)
  source: Harry Potter and the Philosopher's Stone (video game)
avis:
  nickname: The Bird-Conjuring Charm
  description: Conjures a small flock of birds from the end of the caster's wand
  classification: Charm
  difficulty: Intermediate
  pronunciation: AH-viss
  notable_uses: Mr. Ollivander conjures birds to test Viktor Krum's wand ahead of the Triwizard Tournament
  source: Harry Potter and the Goblet of Fire (book)
babbling_curse:
  description: A curse that makes the victim babble ceaselessly
  classification: Curse
  difficulty: Intermediate
  notable_uses: Gilderoy Lockhart boasts he cured a Transylvanian villager of this curse
  source: Harry Potter and the Chamber of Secrets (book)
banishing_charm:
  description: Sends objects away from the caster (acts as a counter-charm to Accio)
