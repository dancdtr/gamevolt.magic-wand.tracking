---
name: "potter.wand-server"
# system_type: eliko_rtls
system_type: eliko_single_anchor

tracked_wand_ids:
  # - E000
  - 1DAE
  # - 1DC6

logging:
  file_path: ./Logs/potter.wand-server.{timestamp}.log
  minimum_level: DEBUG

zones:
  udp_receiver:
    host: "0.0.0.0"
    port: 5005
    max_size: 65556
    recv_timeout_s: 2

  # One zone per spell. key = number to press in the mock UI to enter that zone.
  # Multi-digit keys work via the timed numeric-input buffer in MockZoneControls.
  zones:
    - id: Z001
      key: 1
      spells: [REVELIO]
    - id: Z002
      key: 2
      spells: [LOCOMOTOR]
    - id: Z003
      key: 3
      spells: [ARRESTO_MOMENTUM]
    - id: Z004
      key: 4
      spells: [WINGARDIUM_LEVIOSA]
    - id: Z005
      key: 5
      spells: [METEOLOJINX]
    - id: Z006
      key: 6
      spells: [COLOVARIA]
    - id: Z007
      key: 7
      spells: [SLUGULUS_ERECTO]
    - id: Z008
      key: 8
      spells: [VENTUS]
    - id: Z009
      key: 9
      spells: [RICTUSEMPRA]
    - id: Z010
      key: 10
      spells: [REPARO]
    - id: Z011
      key: 11
      spells: [PIERTOTUM_LOCOMOTOR]
    - id: Z012
      key: 12
      spells: [ALOHOMORA]
    - id: Z013
      key: 13
      spells: [COLLOPORTUS]
    - id: Z014
      key: 14
      spells: [SILENCIO]
    - id: Z015
      key: 15
      spells: [INCENDIO]
    - id: Z016
      key: 16
      spells: [INFLATUS]
    - id: Z017
      key: 17
      spells: [IMMOBULUS]
    - id: Z018
      key: 18
      spells: [APARECIUM]
    - id: Z019
      key: 19
      spells: [ENGORGIO]
    - id: Z020
      key: 20
      spells: [SWITCHING]
    - id: Z021
      key: 21
      spells: [CANTIS]
    - id: Z022
      key: 22
      spells: [PEPPER_BREATH]
    - id: Z023
      key: 23
      spells: [VERA_VERTO]
    - id: Z024
      key: 24
