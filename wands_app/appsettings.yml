input:
  wand:
    # Trim the straight 'approach' run from rest/centre to the glyph start (e.g. the
    # diagonal into the base of an R) before matching + overlay. See lead_in_trimmer.py.
    lead_in_trim:
      enabled: True
      angle_deg: 40.0
      min_trim_fraction: 0.08
      max_trim_fraction: 0.5
      resample_count: 48
    # Trim the straight 'reset' run people make returning toward rest/centre after the
    # glyph, before pausing. Mirror of lead_in_trim, applied at the stroke tail.
    tail_trim:
      enabled: True
      angle_deg: 40.0
      min_trim_fraction: 0.08
      max_trim_fraction: 0.5
      resample_count: 48
    # Reject a cast when an INACTIVE template matches the drawn shape better than the chosen
    # spell (by > margin). $1 absolute scores are forgiving (a perfect LUMOS_MAXIMA scores ~67%
    # on REVELIO), so this restores $1's ranking-based discrimination. Toggle for A/B testing.
    confusion_guard:
      enabled: False
      margin: 0.05
    rmf:
      invert_x: True
      invert_y: False
      abs_invert_x: True
      abs_invert_y: False
      gain_x: 1.0
      gain_y: 1.0
      abs_yaw_limit_deg: 179
      abs_pitch_limit_deg: 179
      abs_clip_mode: "DISCARD"
      deadzone_x: 0.0
      deadzone_y: 0.0
      keep_absolute: True
      tiny_angle: 0
      world_up: "Z"

server:
  disconnect_after_s: 2.0
  web_socket:
    select_interval: 0.1
    web_socket:
      host: "0.0.0.0"
      port: 60901

imu_stream:
  eliko:
    connection:
      host: 192.168.1.119
      port: 25025
      reconnect_delay_s: 2.0
      report_type: PR_Q
    parsing:
      sample_dt_us: 8333
      nsamp_per_packet: 10
      body_forward_x: 0.0
      body_forward_y: 1.0
      body_forward_z: 0.0
    command_sink:
      idle_colour: "WARM_WHITE"
  eliko_single_anchor:
    serial:
      # Set to the anchor's virtual COM port. On macOS look for /dev/tty.usbmodem*,
      # on Linux /dev/ttyACM*, on Windows COMn. Baud is virtual (USB CDC); value ignored.
      port: /dev/tty.usbmodem2101
      baud: 115200
      timeout: 1
      retry_interval: 2.0
    parsing:
      sample_dt_us: 8333
      nsamp_per_packet: 10
      body_forward_x: 0.0
      body_forward_y: 1.0
      body_forward_z: 0.0
    command_sink:
      idle_colour: "WARM_WHITE"
    # SPQF subscription flag. "P" = PR (IMU) packets, "R" = RR (ranging) packets.
    # Set to "R" as a sanity check: if RR lines appear in trace, the wand is alive
    # and the anchor is talking to it.
    subscribe_flag: "P"
    # False = this app issues NO IMU-enable traffic and wires no reboot detector;
    # the RTLS network owns wand IMU state. True = legacy behaviour (anchor enables
    # IMU on tracked wands + re-enables them after reboot).
    manage_imu: False

motion:
  processor:
    speed_smoothing_alpha: 0.15
    # Spatial deadzone — needs tuning against logged path values (see $1 log line `path=`).
    stillness_radius: 0.18
    stillness_window_ms: 130
    phase_tracker:
      speed_start: 0.50
      speed_stop: 0.35
      min_state_duration: 0.03
      min_paused_duration: 0.11
      min_holding_duration: 0.22
      min_stopped_duration: 0.9

# Spell scoring. `bonuses` are global magnitudes; `default` is the per-spell tuning every
# spell inherits; each `overrides` entry is a partial tuning for one spell (omit a field to
# inherit). `thresholds`, when set on an override, REPLACES the whole tier set (a spell need
# not have all four). See spells/settings/spell_scoring_settings.py.
spell_scoring:
  bonuses:
    xp_per_unique_spell: 1
    xp_max: 19.0
    cadence_max: 10.0
    tempo_max: 5.0
    streak_per_fail: 5.0
  default:
    difficulty_weight: 1.0
    min_match_accuracy: 0.40
    min_duration_s: 0.50
    max_duration_s: 5.0
    min_path_length: 0.0
    tempo_ideal_min_s: 0.6
    tempo_ideal_max_s: 2.5
    tempo_decay_s: 1.5
    thresholds:
      RUDIMENTARY: 60
      SKILLED: 70
      EXPERIENCED: 80
      MASTERED: 90
  # overrides: []
  overrides:
    - spell: LUMOS_MAXIMA
      tuning:
        thresholds:
          RUDIMENTARY: 75
          SKILLED: 85
          EXPERIENCED: 90
          MASTERED: 100
    - spell: REPARO
      tuning:
        min_match_accuracy: 0.35
        thresholds:
          RUDIMENTARY: 30
          SKILLED: 40
          EXPERIENCED: 55
          MASTERED: 70
wand_visualiser:
  is_enabled: True
  # The single wand this visualiser follows. Other (multi-wand) modes run headless.
  # wand_id: "1DAE"
  wand_id: 1DAC
  # wand_id: 1DB1

  window:
    title: "Wand Visualiser"
    width: 1600
    height: 640
    background_colour: "#1a1a1a"
    panel_colour: "#161616"
    text_colour: "#dddddd"
  trail:
    scale: 0.2
    render_scale: 4.0
    line_width: 3
    point_radius: 2
    max_points: 256
    draw_points: True
    smooth: True
    line_colour: "#ff6f61"
    fade: True
    tail_alpha: 0.0
    glow: True
    glow_width: 8
    gradient: True
    head_colour: "#ffd166"
    coords_mode: "centred"
    y_up: True
    clip_to_bounds: True
    pixel_margin: 0
  snapshot:
    # Min raw $1 match accuracy for an attempt to replace the held snapshot (noise gate).
    min_match_accuracy: 0.4
    template_colour: "#cccccc"

show_system_controller:
  show_system_udp_tx:
    host: "192.168.1.118"
    port: 6006

  lamp_udp_tx:
    host: "192.168.1.138"
    port: 8888

wand_device_controller:
  # Spell-cast LED cue: fade purple for a quality-tiered duration, then sink
  # restores idle fade. step = PekioClient fade step (FADE_FAST_STEP=15).
  spell_cast_pulse_colour: "PURPLE"
  spell_cast_pulse_step: 15
  rudimentary_spell_cast_pulse_duration_s: 0.5
  skilled_spell_cast_pulse_duration_s: 1.0
  experienced_spell_cast_pulse_duration_s: 1.5
  mastered_spell_cast_pulse_duration_s: 2.0
