input:
  wand:
    rmf:
      invert_x: True
      invert_y: False
      abs_invert_x: True
      abs_invert_y: False
      gain_x: 1.0
      gain_y: 1.0
      abs_yaw_limit_deg: 179
      abs_pitch_limit_deg: 179
      abs_clip_mode: "DISCARD"
      deadzone_x: 0.0
      deadzone_y: 0.0
      keep_absolute: True
      tiny_angle: 0
      world_up: "Z"

server:
  disconnect_after_s: 2.0
  web_socket:
    select_interval: 0.1
    web_socket:
      host: "0.0.0.0"
      port: 60901

imu_stream:
  eliko:
    connection:
      host: 10.8.4.1
      port: 25025
      reconnect_delay_s: 2.0
      report_type: PR_Q
    parsing:
      sample_dt_us: 8333
      nsamp_per_packet: 10
      body_forward_x: 0.0
      body_forward_y: 1.0
      body_forward_z: 0.0
    command_sink:
      idle_colour: "WARM_WHITE"
  eliko_single_anchor:
    serial:
      # Set to the anchor's virtual COM port. On macOS look for /dev/tty.usbmodem*,
      # on Linux /dev/ttyACM*, on Windows COMn. Baud is virtual (USB CDC); value ignored.
      port: /dev/tty.usbmodem2101
      baud: 115200
      timeout: 1
      retry_interval: 2.0
    parsing:
      sample_dt_us: 8333
      nsamp_per_packet: 10
      body_forward_x: 0.0
      body_forward_y: 1.0
      body_forward_z: 0.0
    command_sink:
      idle_colour: "WARM_WHITE"
    # SPQF subscription flag. "P" = PR (IMU) packets, "R" = RR (ranging) packets.
    # Set to "R" as a sanity check: if RR lines appear in trace, the wand is alive
    # and the anchor is talking to it.
    subscribe_flag: "P"

motion:
  gesture_history:
    max_segments: 20
    max_age: 3
  processor:
    phase_tracker:
      speed_start: 0.50
      speed_stop: 0.20
      min_state_duration: 0.03
      min_paused_duration: 0.15
      min_holding_duration: 0.8
      min_stopped_duration: 1.2
    direction_quantizer:
      speed_stop: 0.2
      min_direction_duration: 0.01
      axis_deadband_per_s: 0.1
    segment_builder:
      max_sample_count: 256

wand_visualiser:
  is_enabled: True
  visualiser:
    root:
      title: "Wand Input"
      width: 500
      height: 500
      buffer: 100
    canvas:
      background_colour: "#222"
      highlight_thickness: 0
  label:
    text: ""
    foreground_colour: "#ddd"
    background_colour: "#111"
    side: "bottom"
    fill: "x"
  axes:
    show_axes: True
    colour: "#9ca3af"
    width: 1
  trail:
    scale: 0.2
    line_width: 3
    point_radius: 3
    max_points: 64
    draw_points: True
    smooth: False
    coords_mode: "centred"
    y_up: True
    clip_to_bounds: True
    pixel_margin: 0

wand_colours:
  - "#00acc1"
  - "#fdd835"
  - "#e65c59"
  - "#7cb342"
  - "#fb8c00"
  - "#ca537f"
  - "#994aae"
  - "#888fbe"
  - "#1e88e5"
  - "#5e35b1"
  - "#039be5"
  - "#00897b"
  - "#43a047"
  - "#f4511e"
  - "#6d4c41"
  - "#546e7a"

accuracy:
  weights:
    step_count_weight: 0.7
    relative_group_distance_weight: 0.15
    relative_group_duration_weight: 0.15
    required_step_bias: 0.5

show_system_controller:
  show_system_udp_tx:
    host: "192.168.1.121"
    port: 6006

  lamp_udp_tx:
    host: "192.168.1.138"
    port: 8888

zone_visualisation:
  visualiser:
    root:
      title: "Spell"
      width: 800
      height: 800
      buffer: 100
    canvas:
      background_colour: "#222"
      highlight_thickness: 0

spell_image_library:
  instruction:
    assets_dir: ["assets", "spells"]
    image_size: 500
    bg_colour: [255, 255, 255]
    icon_colour: [0, 0, 0]
  success:
    assets_dir: ["assets", "spells"]
    image_size: 500
    bg_colour: [0, 255, 0]
    icon_colour: [0, 0, 0]

wand_device_controller:
  # Spell-cast LED cue: fade purple for a quality-tiered duration, then sink
  # restores idle fade. step = PekioClient fade step (FADE_FAST_STEP=15).
  spell_cast_pulse_colour: "PURPLE"
  spell_cast_pulse_step: 15
  rudimentary_spell_cast_pulse_duration_s: 0.5
  skilled_spell_cast_pulse_duration_s: 1.0
  experienced_spell_cast_pulse_duration_s: 1.5
  mastered_spell_cast_pulse_duration_s: 2.0
