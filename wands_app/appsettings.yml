---
name: "potter.wand-server"
system_type: eliko_rtls

tracked_wand_ids:
  - 1DAE
  - 1DC6
  - 1DA5
  - 1DB0
  - 1DBA
  - 1DA7
  - 1DBF
  - 1DB6
  - 1DB7
  - 1DC3
  - 1DC5
  - 1DA8
  - 1DC9
  - 1DAA
  - 1DAB
  - 1D65
  - 1DAD
  - 1DB2
  - 1DB4

wand_houses:
  houses: {}

logging:
  file_path: ./Logs/potter.wand-server.{timestamp}.log
  minimum_level: DEBUG

zones:
  udp_receiver:
    host: "0.0.0.0"
    port: 5006
    max_size: 65556
    recv_timeout_s: 2
  zones:
    - id: Z001
      key: 1
      spells: [CANTIS]
    - id: Z002
      key: 2
      spells: [RICTUSEMPRA]
    - id: Z003
      key: 3
      spells: [ALOHOMORA, COLLOPORTUS]
    - id: Z004
      key: 4
      spells: [] #spellbook
    - id: Z005
      key: 5
      spells: [PEPPER_BREATH_HEX]
    - id: Z006
      key: 6
      spells: [LUMOS, NOX]
    - id: Z007
      key: 7
      spells: [INCENDIO, EXTINGUISHING_SPELL]
    - id: Z008
      key: 8
      spells: [COLOVARIA, SILENCIO]
input:
  wand:
    lead_in_trim:
      enabled: True
      angle_deg: 40.0
      min_trim_fraction: 0.08
      max_trim_fraction: 0.5
      resample_count: 48
    tail_trim:
      enabled: True
      angle_deg: 40.0
      min_trim_fraction: 0.08
      max_trim_fraction: 0.5
      resample_count: 48
    confusion_guard:
      enabled: False
      margin: 0.05
    rmf:
      invert_x: True
      invert_y: False
      abs_invert_x: True
      abs_invert_y: False
      gain_x: 1.0
      gain_y: 1.0
      abs_yaw_limit_deg: 179
      abs_pitch_limit_deg: 179
      abs_clip_mode: "DISCARD"
      deadzone_x: 0.0
      deadzone_y: 0.0
      keep_absolute: True
      tiny_angle: 0
      world_up: "Z"

server:
  disconnect_after_s: 2.0
  web_socket:
    select_interval: 0.1
    web_socket:
      host: "0.0.0.0"
      port: 60901

imu_stream:
  eliko:
    connection:
      host: 192.168.1.119
      port: 25025
      reconnect_delay_s: 2.0
      report_type: PR_Q
    parsing:
      sample_dt_us: 8333
      nsamp_per_packet: 10
      body_forward_x: 0.0
      body_forward_y: 1.0
      body_forward_z: 0.0
    command_sink:
      idle_colour: "WARM_WHITE"
  eliko_single_anchor:
    serial:
      # Set to the anchor's virtual COM port. On macOS look for /dev/tty.usbmodem*,
      # on Linux /dev/ttyACM*, on Windows COMn. Baud is virtual (USB CDC); value ignored.
      port: /dev/serial/by-id/usb-Eliko_LLC_Kio_Anchor_COM_Port-if00
      baud: 115200
      timeout: 1
      retry_interval: 2.0
    parsing:
      sample_dt_us: 8333
      nsamp_per_packet: 10
      body_forward_x: 0.0
      body_forward_y: 1.0
      body_forward_z: 0.0
    command_sink:
      idle_colour: "WARM_WHITE"
    # SPQF subscription flag. "P" = PR (IMU) packets, "R" = RR (ranging) packets.
    # Set to "R" as a sanity check: if RR lines appear in trace, the wand is alive
    # and the anchor is talking to it.
    subscribe_flag: "P"
    # False = this app issues NO IMU-enable traffic and wires no reboot detector;
    # the RTLS network owns wand IMU state. True = legacy behaviour (anchor enables
    # IMU on tracked wands + re-enables them after reboot).
    manage_imu: False

motion:
  processor:
    speed_smoothing_alpha: 0.15
    stillness_radius: 0.25
    stillness_window_ms: 130
    phase_tracker:
      speed_start: 0.50
      speed_stop: 0.35
      min_state_duration: 0.03
      min_paused_duration: 0.11
      min_holding_duration: 0.22
      min_stopped_duration: 0.9

spell_scoring:
  bonuses:
    xp_per_unique_spell: 1
    xp_max: 19.0
    cadence_max: 10.0
    tempo_max: 5.0
    streak_per_fail: 5.0
  default:
    difficulty_weight: 1.0
    min_match_accuracy: 0.40
    min_duration_s: 0.50
    max_duration_s: 5.0
    min_path_length: 0.0
    tempo_ideal_min_s: 0.6
    tempo_ideal_max_s: 2.5
    tempo_decay_s: 1.5
    thresholds:
      RUDIMENTARY: 60
      SKILLED: 70
      EXPERIENCED: 80
      MASTERED: 90
  # overrides: []
  overrides:
    - spell: LUMOS
      tuning:
        thresholds:
          RUDIMENTARY: 75
          SKILLED: 85
          EXPERIENCED: 90
          MASTERED: 100
    - spell: REPARO
      tuning:
        min_match_accuracy: 0.35
        thresholds:
          RUDIMENTARY: 30
          SKILLED: 40
          EXPERIENCED: 55
          MASTERED: 70
    - spell: ALOHOMORA
      tuning:
        min_match_accuracy: 0.35
        thresholds:
          RUDIMENTARY: 40
          SKILLED: 50
          EXPERIENCED: 60
          MASTERED: 70
wand_visualiser:
  is_enabled: True
  wand_id: 1DAC
  window:
    title: "Wand Visualiser"
    width: 1600
    height: 640
    background_colour: "#1a1a1a"
    panel_colour: "#161616"
    text_colour: "#dddddd"
  trail:
    scale: 0.2
    render_scale: 4.0
    line_width: 3
    point_radius: 2
    max_points: 256
    draw_points: True
    smooth: True
    line_colour: "#ff6f61"
    fade: True
    tail_alpha: 0.0
    glow: True
    glow_width: 8
    gradient: True
    head_colour: "#ffd166"
    coords_mode: "centred"
    y_up: True
    clip_to_bounds: True
    pixel_margin: 0
  snapshot:
    min_match_accuracy: 0.4
    template_colour: "#cccccc"

multi_wand_visualiser:
  is_enabled: True
  palette:   # 20 distinct hues (golden-angle spacing) so consecutively-assigned wands differ most
    - "#ff3838" # red
    - "#38ff72" # green
    - "#ac38ff" # violet
    - "#ffe638" # yellow
    - "#38ddff" # cyan
    - "#ff38a3" # pink
    - "#69ff38" # lime
    - "#4038ff" # blue
    - "#ff7a38" # orange
    - "#38ffb4" # mint
    - "#ee38ff" # magenta
    - "#d5ff38" # chartreuse
    - "#389bff" # azure
    - "#ff3861" # rose
    - "#38ff49" # emerald
    - "#8338ff" # indigo
    - "#ffbd38" # amber
    - "#38fff7" # turquoise
    - "#ff38cc" # fuchsia
    - "#92ff38" # spring green
  window:
    title: "RTLS Wand Visualiser"
    width: 1280
    height: 900
    background_colour: "#1a1a1a"
    panel_colour: "#161616"
    text_colour: "#dddddd"
  trail:
    scale: 0.2
    render_scale: 2.0
    line_width: 3
    point_radius: 2
    max_points: 256
    draw_points: False
    smooth: False
    line_colour: "#ff3838"
    fade: False
    tail_alpha: 0.0
    glow: False
    glow_width: 8
    gradient: False
    head_colour: "#ff3838"
    coords_mode: "centred"
    y_up: True
    clip_to_bounds: True
    pixel_margin: 0

show_system_controller:
  enabled: true
  destinations:
    - name: forshaw_show_system
      udp_tx:
        host: 192.168.1.118
        port: 6006
      spells:
        - RICTUSEMPRA
        - ALOHOMORA
        - COLLOPORTUS
        - CANTIS
        - PEPPER_BREATH_HEX
        - INCENDIO
        - EXTINGUISHING_SPELL

    - name: common_room_lights
      udp_tx:
        host: 172.30.3.201
        port: 6006
      spells:
        - LUMOS
        - NOX

    - name: niffler_lamp
      udp_tx:
        host: 172.30.3.193
        port: 6006
      spells:
        - COLOVARIA
        - SILENCIO

wand_device_controller:
  # Spell-cast LED cue: fade purple for a quality-tiered duration, then sink
  # restores idle fade. step = PekioClient fade step (FADE_FAST_STEP=15).
  spell_cast_pulse_colour: "PURPLE"
  spell_cast_pulse_step: 15
  rudimentary_spell_cast_pulse_duration_s: 0.5
  skilled_spell_cast_pulse_duration_s: 1.0
  experienced_spell_cast_pulse_duration_s: 1.5
  mastered_spell_cast_pulse_duration_s: 2.0

session_recorder:
  is_enabled: True
  # Relative paths resolve against the runtime root; absolute paths used as-is.
  # Each record toggle creates <output_dir>/<timestamp>_<name>/.
  output_dir: ./recordings
  save_images: True
  image_width: 600
  image_height: 800
